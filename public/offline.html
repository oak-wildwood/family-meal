<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline | Family Meal</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --text: #1c1c1a;
        --muted: #5c5c57;
        --accent: #8a5600;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141413;
          --text: #edede9;
          --muted: #a6a6a0;
          --accent: #e9b24e;
        }
      }
      body {
        margin: 0;
        padding: max(48px, env(safe-area-inset-top)) 24px 48px;
        background: var(--bg);
        color: var(--text);
        font:
          17px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 12px;
        font:
          600 32px/1.1 Georgia,
          serif;
      }
      p {
        color: var(--muted);
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        This page isn't saved on this device. Every recipe is saved for offline use, so those still
        work.
      </p>
      <a href="/">Back to all recipes</a>
    </main>
  </body>
</html>
