<!doctype html>
<!--
  Source for the app icons in public/icons. Renders the "FM" monogram at the
  window size. Regenerate with scripts/icons/make-icons.sh (needs Chrome).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Newsreader Variable';
        font-weight: 200 800;
        src: url(../../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2)
          format('woff2-variations');
      }
      html,
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background: #7a4b00;
        color: #fff;
        /* Inside the maskable safe zone (the central 80% circle). */
        font: 600 40vw/1 'Newsreader Variable', Georgia, serif;
        font-optical-sizing: auto;
        letter-spacing: -0.03em;
      }
      span {
        transform: translateY(6vw);
      }
    </style>
  </head>
  <body>
    <span>FM</span>
  </body>
</html>
